pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
// Invoke the installed CLI directly: avoid an extra Windows cmd/npx layer during autolinking.
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(["node", file("../node_modules/@react-native-community/cli/build/bin.js").absolutePath, "config"])
}
rootProject.name = 'com.safeherai'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
